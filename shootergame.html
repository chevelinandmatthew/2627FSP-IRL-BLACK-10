<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Galaxy Blaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05010f;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #gameContainer {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    background: radial-gradient(ellipse at center, #14082e 0%, #05010f 70%);
    box-shadow: 0 0 60px rgba(120,60,255,0.35), inset 0 0 100px rgba(0,0,0,0.6);
    border: 2px solid rgba(140,90,255,0.35);
    border-radius: 8px;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 22px;
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    font-size: 15px;
  }
  #hud .box {
    background: rgba(20,8,46,0.55);
    border: 1px solid rgba(140,90,255,0.4);
    border-radius: 8px;
    padding: 6px 14px;
    backdrop-filter: blur(2px);
  }
  #hearts { color: #ff4d7d; letter-spacing: 3px; }
  #levelUp {
    position: absolute; top: 46%; left: 50%;
    transform: translate(-50%,-50%);
    color: #ffe066;
    font-size: 34px; font-weight: 900;
    text-shadow: 0 0 20px #ffb703, 0 0 40px #ffb703;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(30,10,60,0.92), rgba(2,0,10,0.97));
    color: #fff; text-align: center;
    border-radius: 8px;
  }
  #overlay h1 {
    font-size: 46px;
    background: linear-gradient(90deg,#7b2ff7,#f107a3,#ffb703);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(120,60,255,0.6);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  #overlay p { color: #cbb8ff; margin: 6px 0 22px; font-size: 15px; max-width: 400px; line-height: 1.5; }
  #overlay .stat { font-size: 20px; color: #ffe066; margin-bottom: 18px; display:none; }
  button.play {
    background: linear-gradient(135deg,#7b2ff7,#f107a3);
    border: none; color: #fff; font-weight: bold;
    padding: 14px 38px; border-radius: 30px;
    font-size: 18px; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(241,7,163,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button.play:hover { transform: scale(1.06); box-shadow: 0 0 35px rgba(241,7,163,0.8); }
  .hint { margin-top: 18px; font-size: 12.5px; color: #9d8ac9; }
  #mobileControls {
    position: absolute; bottom: 16px; left: 0; right: 0;
    display: none; justify-content: space-between; padding: 0 18px;
    pointer-events: none;
  }
  #mobileControls button {
    pointer-events: all;
    width: 64px; height: 64px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(120,60,255,0.25);
    color: #fff; font-size: 22px;
    backdrop-filter: blur(3px);
  }
  #fireBtn {
    width: 78px !important; height: 78px !important;
    background: rgba(241,7,163,0.35) !important;
    font-size: 26px !important;
  }
  @media (max-width: 820px) {
    #mobileControls { display: flex; }
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="hud">
    <div class="box">SKOR: <span id="score">0</span></div>
    <div class="box" id="hearts">❤❤❤</div>
    <div class="box">LV <span id="level">1</span></div>
  </div>
  <div id="levelUp">LEVEL UP!</div>
  <div id="overlay">
    <h1>🚀 GALAXY BLASTER</h1>
    <p>Hancurkan gerombolan alien, kumpulkan power-up, dan bertahanlah selama mungkin! Gunakan mouse/sentuhan untuk gerak, klik/tap untuk menembak (atau tahan untuk tembak otomatis).</p>
    <div class="stat" id="finalStat"></div>
    <button class="play" id="playBtn">MULAI MAIN</button>
    <div class="hint">🖱️ Gerakkan mouse untuk bergerak &nbsp;|&nbsp; Klik untuk menembak &nbsp;|&nbsp; Spasi juga bisa</div>
  </div>
  <div id="mobileControls">
    <button id="leftBtn">◀</button>
    <button id="fireBtn">🔥</button>
    <button id="rightBtn">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const heartsEl = document.getElementById('hearts');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('playBtn');
const finalStat = document.getElementById('finalStat');
const levelUpEl = document.getElementById('levelUp');

let running = false;
let keys = {};
let mouseX = W/2;
let firing = false;

let player, bullets, enemies, enemyBullets, particles, stars, powerUps;
let score, lives, level, frame, spawnTimer, powerTimer, shake;
let fireCooldown = 0;

function initStars() {
  stars = [];
  for (let i=0;i<90;i++) {
    stars.push({x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8+0.3, s: Math.random()*2+0.5});
  }
}

function resetGame() {
  player = { x: W/2, y: H-90, w: 40, h: 40, speed: 7, power: 1, shield: 0 };
  bullets = [];
  enemies = [];
  enemyBullets = [];
  particles = [];
  powerUps = [];
  score = 0;
  lives = 3;
  level = 1;
  frame = 0;
  spawnTimer = 0;
  powerTimer = 0;
  shake = 0;
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  heartsEl.textContent = '❤'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(3-lives,0));
}

// ---------- INPUT ----------
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W/rect.width);
});
canvas.addEventListener('mousedown', () => firing = true);
canvas.addEventListener('mouseup', () => firing = false);
canvas.addEventListener('touchmove', e => {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  mouseX = (t.clientX - rect.left) * (W/rect.width);
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchstart', e => { firing = true; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', () => firing = false);

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') firing = true;
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') firing = false;
});

const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const fireBtn = document.getElementById('fireBtn');
leftBtn.addEventListener('touchstart', e=>{keys['ArrowLeft']=true; e.preventDefault();});
leftBtn.addEventListener('touchend', e=>{keys['ArrowLeft']=false;});
rightBtn.addEventListener('touchstart', e=>{keys['ArrowRight']=true; e.preventDefault();});
rightBtn.addEventListener('touchend', e=>{keys['ArrowRight']=false;});
fireBtn.addEventListener('touchstart', e=>{firing=true; e.preventDefault();});
fireBtn.addEventListener('touchend', e=>{firing=false;});

// ---------- HELPERS ----------
function rectHit(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function spawnParticles(x,y,color,n=14,speed=4) {
  for (let i=0;i<n;i++) {
    const ang = Math.random()*Math.PI*2;
    const sp = Math.random()*speed+1;
    particles.push({
      x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      life: 30+Math.random()*20, maxLife: 50, color, r: Math.random()*3+1.5
    });
  }
}

function spawnEnemy() {
  const type = Math.random();
  let e;
  if (type < 0.15 && level >= 2) {
    // tough enemy
    e = { x: Math.random()*(W-50)+25, y: -40, w: 46, h: 40, hp: 4, maxHp:4, speed: 1.3+level*0.1, type:'tough', shootTimer: Math.random()*90, vx:0 };
  } else if (type < 0.35) {
    // zigzag
    e = { x: Math.random()*(W-40)+20, y: -40, w: 34, h: 30, hp: 1, maxHp:1, speed: 1.8+level*0.12, type:'zigzag', t:0, shootTimer: 999, vx:0 };
  } else {
    e = { x: Math.random()*(W-40)+20, y: -40, w: 34, h: 30, hp: 2, maxHp:2, speed: 1.4+level*0.1, type:'basic', shootTimer: Math.random()*120+40, vx:0 };
  }
  enemies.push(e);
}

function spawnPowerUp(x,y) {
  if (Math.random() < 0.22) {
    const types = ['power','life','shield'];
    const t = types[Math.floor(Math.random()*types.length)];
    powerUps.push({x,y,w:22,h:22,vy:2.2,type:t});
  }
}

// ---------- UPDATE ----------
function update() {
  frame++;
  shake *= 0.9;

  // player movement
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['KeyA'] && !keys['KeyD']) {
    player.x += (mouseX - player.x) * 0.18;
  }
  player.x = Math.max(player.w/2+5, Math.min(W-player.w/2-5, player.x));

  // firing
  fireCooldown--;
  if (firing && fireCooldown <= 0) {
    const baseY = player.y - 20;
    if (player.power === 1) {
      bullets.push({x: player.x, y: baseY, w:4, h:14, vy:-11});
    } else if (player.power === 2) {
      bullets.push({x: player.x-10, y: baseY, w:4, h:14, vy:-11});
      bullets.push({x: player.x+10, y: baseY, w:4, h:14, vy:-11});
    } else {
      bullets.push({x: player.x-14, y: baseY, w:4, h:14, vy:-11, vx:-1.5});
      bullets.push({x: player.x, y: baseY-6, w:4, h:14, vy:-12});
      bullets.push({x: player.x+14, y: baseY, w:4, h:14, vy:-11, vx:1.5});
    }
    fireCooldown = 8;
  }

  // bullets
  bullets.forEach(b => { b.y += b.vy; if (b.vx) b.x += b.vx; });
  bullets = bullets.filter(b => b.y > -20);

  // spawn logic - scale with level
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(50 - level*4, 16) + Math.random()*20;
  }

  // level up over time / score
  const newLevel = Math.floor(score/500)+1;
  if (newLevel > level) {
    level = newLevel;
    levelUpEl.style.opacity = 1;
    setTimeout(()=> levelUpEl.style.opacity = 0, 900);
  }

  // enemies
  enemies.forEach(e => {
    if (e.type === 'zigzag') {
      e.t += 0.05;
      e.x += Math.sin(e.t)*3;
    }
    e.y += e.speed;
    e.shootTimer--;
    if (e.shootTimer <= 0 && e.y > 0 && e.y < H-100) {
      const ang = Math.atan2((player.y-e.y),(player.x-e.x));
      enemyBullets.push({x:e.x, y:e.y, w:5,h:10, vx: Math.cos(ang)*4, vy: Math.sin(ang)*4});
      e.shootTimer = 90 + Math.random()*60;
    }
  });
  enemies = enemies.filter(e => e.y < H+60);

  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  enemyBullets = enemyBullets.filter(b => b.y < H+20 && b.y > -20 && b.x > -20 && b.x < W+20);

  // power-ups
  powerUps.forEach(p => p.y += p.vy);
  powerUps = powerUps.filter(p => p.y < H+30);

  // particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx*=0.96; p.vy*=0.96; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // collisions: bullets vs enemies
  for (let i = enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    for (let j = bullets.length-1; j>=0; j--) {
      const b = bullets[j];
      if (rectHit({x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h}, {x:b.x-b.w/2,y:b.y-b.h/2,w:b.w,h:b.h})) {
        bullets.splice(j,1);
        e.hp--;
        spawnParticles(b.x,b.y,'#ffb703',5,3);
        if (e.hp <= 0) {
          spawnParticles(e.x,e.y, e.type==='tough' ? '#ff4d7d' : '#7ee787', 22, 5);
          score += e.type==='tough' ? 60 : e.type==='zigzag' ? 25 : 20;
          spawnPowerUp(e.x,e.y);
          enemies.splice(i,1);
          shake = 6;
        }
        break;
      }
    }
  }

  // enemy vs player
  const pBox = {x:player.x-player.w/2, y:player.y-player.h/2, w:player.w, h:player.h};
  for (let i=enemies.length-1;i>=0;i--) {
    const e = enemies[i];
    if (rectHit(pBox, {x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h})) {
      enemies.splice(i,1);
      hitPlayer();
    }
  }
  for (let i=enemyBullets.length-1;i>=0;i--) {
    const b = enemyBullets[i];
    if (rectHit(pBox, {x:b.x-b.w/2,y:b.y-b.h/2,w:b.w,h:b.h})) {
      enemyBullets.splice(i,1);
      hitPlayer();
    }
  }
  for (let i=powerUps.length-1;i>=0;i--) {
    const p = powerUps[i];
    if (rectHit(pBox, {x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h})) {
      powerUps.splice(i,1);
      applyPowerUp(p.type);
      spawnParticles(p.x,p.y,'#4dd0ff',12,3);
    }
  }

  updateHUD();
  if (lives <= 0) endGame();
}

function hitPlayer() {
  if (player.shield > 0) {
    player.shield--;
    spawnParticles(player.x, player.y, '#4dd0ff', 16, 4);
    shake = 4;
    return;
  }
  lives--;
  shake = 14;
  spawnParticles(player.x, player.y, '#ff4d7d', 20, 5);
}

function applyPowerUp(type) {
  if (type === 'power') player.power = Math.min(3, player.power+1);
  else if (type === 'life') lives = Math.min(3, lives+1);
  else if (type === 'shield') player.shield = Math.min(2, player.shield+1);
}

function endGame() {
  running = false;
  finalStat.style.display = 'block';
  finalStat.textContent = `Skor Akhir: ${score}  |  Level Tercapai: ${level}`;
  document.querySelector('#overlay h1').textContent = '💥 GAME OVER';
  document.querySelector('#overlay p').textContent = 'Pesawatmu hancur! Coba lagi dan kalahkan skor tertinggimu.';
  playBtn.textContent = 'MAIN LAGI';
  overlay.style.display = 'flex';
}

// ---------- DRAW ----------
function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    s.y += s.s;
    if (s.y > H) s.y = 0;
    ctx.globalAlpha = 0.5 + Math.sin(frame*0.02+s.x)*0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  // engine glow
  const glow = ctx.createRadialGradient(0,22,2,0,22,18);
  glow.addColorStop(0,'rgba(255,180,60,0.9)');
  glow.addColorStop(1,'rgba(255,180,60,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0,22+Math.random()*3,16,0,Math.PI*2);
  ctx.fill();

  if (player.shield > 0) {
    ctx.strokeStyle = 'rgba(77,208,255,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,0,30,0,Math.PI*2);
    ctx.stroke();
  }

  // ship body
  const grad = ctx.createLinearGradient(0,-22,0,22);
  grad.addColorStop(0,'#c9a6ff');
  grad.addColorStop(1,'#7b2ff7');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0,-22);
  ctx.lineTo(16,18);
  ctx.lineTo(6,12);
  ctx.lineTo(0,18);
  ctx.lineTo(-6,12);
  ctx.lineTo(-16,18);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#f107a3';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#4dd0ff';
  ctx.beginPath();
  ctx.arc(0,-4,4,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  let color1, color2;
  if (e.type === 'tough') { color1='#ff4d7d'; color2='#7a0030'; }
  else if (e.type === 'zigzag') { color1='#ffe066'; color2='#a86b00'; }
  else { color1='#7ee787'; color2='#0f6b2c'; }

  const grad = ctx.createLinearGradient(0,-e.h/2,0,e.h/2);
  grad.addColorStop(0,color1);
  grad.addColorStop(1,color2);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0,e.h/2);
  ctx.lineTo(e.w/2,-e.h/2);
  ctx.lineTo(e.w/4,-e.h/4);
  ctx.lineTo(0,-e.h/2+4);
  ctx.lineTo(-e.w/4,-e.h/4);
  ctx.lineTo(-e.w/2,-e.h/2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (e.hp < e.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-e.w/2,-e.h/2-8,e.w,4);
    ctx.fillStyle = '#7ee787';
    ctx.fillRect(-e.w/2,-e.h/2-8,e.w*(e.hp/e.maxHp),4);
  }
  ctx.restore();
}

function drawBullets() {
  bullets.forEach(b => {
    const grad = ctx.createLinearGradient(0,b.y-b.h,0,b.y);
    grad.addColorStop(0,'rgba(77,208,255,0)');
    grad.addColorStop(1,'#e0f7ff');
    ctx.fillStyle = grad;
    ctx.fillRect(b.x-b.w/2, b.y-b.h, b.w, b.h);
  });
  enemyBullets.forEach(b => {
    ctx.fillStyle = '#ff6b8a';
    ctx.beginPath();
    ctx.arc(b.x,b.y,4,0,Math.PI*2);
    ctx.fill();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life/p.maxLife, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawPowerUps() {
  powerUps.forEach(p => {
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(frame*0.05);
    let c = p.type==='power' ? '#ffb703' : p.type==='life' ? '#ff4d7d' : '#4dd0ff';
    ctx.fillStyle = c;
    ctx.shadowColor = c;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#05010f';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = p.type==='power' ? 'P' : p.type==='life' ? '+' : 'S';
    ctx.fillText(label, p.x, p.y+1);
  });
}

function draw() {
  ctx.save();
  const sx = (Math.random()-0.5)*shake;
  const sy = (Math.random()-0.5)*shake;
  ctx.clearRect(0,0,W,H);
  ctx.translate(sx,sy);
  drawStars();
  drawPowerUps();
  enemies.forEach(drawEnemy);
  drawBullets();
  drawParticles();
  drawPlayer();
  ctx.restore();
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

playBtn.addEventListener('click', () => {
  resetGame();
  overlay.style.display = 'none';
  running = true;
  loop();
});

initStars();
draw();
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic Tac Toe Premium</title>
  <style>
    :root{
      --bg-1: #0f1724;
      --bg-2: #071029;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.06);
      --accent: #06b6d4;
      --accent-2: #7c3aed;
      --x-color: #ff7a7a;
      --o-color: #7ae3ff;
      --muted: #9fb0c8;
      --win: #16a34a;
      --shadow: 0 10px 30px rgba(2,6,23,0.6);
      --glass-border: rgba(255,255,255,0.06);
      font-synthesis: none;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent 8%),
                  radial-gradient(1000px 500px at 90% 90%, rgba(6,182,212,0.08), transparent 10%),
                  linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:#e6eef6;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .wrap{
      width:100%;
      max-width:820px;
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:22px;
      align-items:start;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      padding:18px;
      box-shadow: var(--shadow);
      border:1px solid var(--glass-border);
      backdrop-filter: blur(8px) saturate(120%);
    }

    .left{
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    header.app-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .logo{
      width:48px;
      height:48px;
      border-radius:10px;
      background: linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:white;
      box-shadow: 0 6px 18px rgba(124,58,237,0.18);
    }
    h1{font-size:18px;margin:0}
    .subtitle{color:var(--muted);font-size:13px}

    .board-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.02);
    }

    .board{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
      width:360px;
      height:360px;
      padding:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border-radius:12px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
    }

    .cell{
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:56px;
      cursor:pointer;
      user-select:none;
      transition: transform .12s cubic-bezier(.2,.9,.2,1), box-shadow .12s ease, background .12s ease;
      border:1px solid rgba(255,255,255,0.02);
      color:var(--muted);
      position:relative;
      overflow:hidden;
    }
    .cell:hover{ transform: translateY(-6px); box-shadow: 0 12px 30px rgba(2,6,23,0.6) }
    .cell.disabled{ cursor:default; opacity:0.95; transform:none; box-shadow:none }
    .cell.x{ color: var(--x-color); text-shadow: 0 6px 18px rgba(255,122,122,0.08) }
    .cell.o{ color: var(--o-color); text-shadow: 0 6px 18px rgba(122,227,255,0.08) }

    .cell::after{
      content:'';
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      opacity:0;
      transition:opacity .18s ease;
    }
    .cell:hover::after{ opacity:1 }

    .turn-indicator{
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 12px;
      border-radius:12px;
      background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.02);
      width:fit-content;
    }
    .turn-dot{
      width:14px;height:14px;border-radius:50%;
      box-shadow:0 6px 14px rgba(0,0,0,0.45);
    }
    .turn-x{ background: linear-gradient(90deg,var(--x-color), #ffb3b3) }
    .turn-o{ background: linear-gradient(90deg,var(--o-color), #bff0ff) }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      margin-top:6px;
    }
    .btn{
      background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color:var(--accent);
      border:1px solid rgba(6,182,212,0.12);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover{ transform: translateY(-4px); box-shadow: 0 10px 30px rgba(6,182,212,0.06) }
    .btn.ghost{ color:var(--muted); border:1px solid rgba(255,255,255,0.03) }

    .right{
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:16px;
      min-height:320px;
    }

    .card{
      padding:14px;
      border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.02);
    }

    .scoreboard{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }
    .score-item{
      flex:1;
      padding:12px;
      border-radius:10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      text-align:center;
    }
    .score-item strong{ display:block; font-size:20px; margin-top:6px; color:#fff }

    .message{
      color:var(--muted);
      font-size:14px;
      min-height:36px;
    }

    .winning-line{
      position:absolute;
      height:6px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border-radius:6px;
      transform-origin:center;
      box-shadow: 0 8px 30px rgba(6,182,212,0.06);
      pointer-events:none;
      transition:opacity .18s ease;
    }

    /* small screens */
    @media (max-width:880px){
      .wrap{ grid-template-columns: 1fr; padding:8px }
      .board{ width:320px; height:320px }
    }
    @media (max-width:420px){
      .board{ width:260px; height:260px; gap:8px }
      .cell{ font-size:40px }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel left">
      <header class="app-header">
        <div class="title">
          <div class="logo">TTT</div>
          <div>
            <h1>Tic Tac Toe Premium</h1>
            <div class="subtitle">Mainkan bersama teman atau nikmati tampilan yang lebih elegan</div>
          </div>
        </div>

        <div class="turn-indicator" aria-live="polite">
          <div id="turnDot" class="turn-dot turn-x" aria-hidden="true"></div>
          <div style="font-weight:700">Giliran <span id="turnText">X</span></div>
        </div>
      </header>

      <div class="board-wrap" style="position:relative">
        <div id="board" class="board" role="grid" aria-label="Papan permainan">
          <div class="cell" data-index="0" role="button" tabindex="0" aria-label="Kotak 1"></div>
          <div class="cell" data-index="1" role="button" tabindex="0" aria-label="Kotak 2"></div>
          <div class="cell" data-index="2" role="button" tabindex="0" aria-label="Kotak 3"></div>
          <div class="cell" data-index="3" role="button" tabindex="0" aria-label="Kotak 4"></div>
          <div class="cell" data-index="4" role="button" tabindex="0" aria-label="Kotak 5"></div>
          <div class="cell" data-index="5" role="button" tabindex="0" aria-label="Kotak 6"></div>
          <div class="cell" data-index="6" role="button" tabindex="0" aria-label="Kotak 7"></div>
          <div class="cell" data-index="7" role="button" tabindex="0" aria-label="Kotak 8"></div>
          <div class="cell" data-index="8" role="button" tabindex="0" aria-label="Kotak 9"></div>
        </div>
        <div id="winLine" class="winning-line" style="opacity:0"></div>
      </div>

      <div class="controls">
        <div style="display:flex;gap:8px">
          <button id="resetBtn" class="btn">Main Baru</button>
          <button id="clearScoreBtn" class="btn ghost">Reset Skor</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="hintBtn" class="btn ghost">Tampilkan Hint</button>
          <button id="aiBtn" class="btn">Main vs AI</button>
        </div>
      </div>
    </div>

    <aside class="panel right">
      <div class="card scoreboard">
        <div class="score-item">
          <div style="color:var(--x-color);font-weight:700">X</div>
          <strong id="scoreX">0</strong>
        </div>
        <div class="score-item">
          <div style="color:var(--o-color);font-weight:700">O</div>
          <strong id="scoreO">0</strong>
        </div>
        <div class="score-item">
          <div style="color:var(--muted);font-weight:700">Seri</div>
          <strong id="scoreDraw">0</strong>
        </div>
      </div>

      <div class="card">
        <div class="message" id="message">Klik kotak untuk mulai bermain. Aktifkan AI untuk lawan komputer.</div>
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div style="font-weight:700;color:var(--muted)">Kontrol Cepat</div>
        <div style="display:flex;gap:8px">
          <button id="undoBtn" class="btn ghost">Undo</button>
          <button id="redoBtn" class="btn ghost">Redo</button>
          <button id="themeBtn" class="btn">Ganti Tema</button>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // State
    const cells = Array.from(document.querySelectorAll('.cell'));
    const turnText = document.getElementById('turnText');
    const turnDot = document.getElementById('turnDot');
    const messageEl = document.getElementById('message');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDrawEl = document.getElementById('scoreDraw');
    const winLine = document.getElementById('winLine');

    let boardState = Array(9).fill('');
    let currentPlayer = 'X';
    let isGameActive = true;
    let scores = { X:0, O:0, D:0 };
    let history = [];
    let future = [];
    let aiEnabled = false;
    let hintVisible = false;

    const winningCombos = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    // Helpers
    function updateTurnUI(){
      turnText.textContent = currentPlayer;
      turnDot.classList.toggle('turn-x', currentPlayer === 'X');
      turnDot.classList.toggle('turn-o', currentPlayer === 'O');
    }

    function renderBoard(){
      cells.forEach((cell,i) => {
        cell.textContent = boardState[i];
        cell.classList.remove('x','o','disabled','win');
        if(boardState[i] === 'X') cell.classList.add('x','disabled');
        if(boardState[i] === 'O') cell.classList.add('o','disabled');
        if(!isGameActive) cell.classList.add('disabled');
      });
    }

    function checkWinner(){
      for(const combo of winningCombos){
        const [a,b,c] = combo;
        if(boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]){
          return { winner: boardState[a], combo };
        }
      }
      if(boardState.every(Boolean)) return { winner: 'draw' };
      return null;
    }

    function showWinLine(combo){
      // compute positions
      const boardRect = document.getElementById('board').getBoundingClientRect();
      const aEl = cells[combo[0]].getBoundingClientRect();
      const cEl = cells[combo[2]].getBoundingClientRect();
      const centerA = { x: aEl.left + aEl.width/2 - boardRect.left, y: aEl.top + aEl.height/2 - boardRect.top };
      const centerC = { x: cEl.left + cEl.width/2 - boardRect.left, y: cEl.top + cEl.height/2 - boardRect.top };
      const dx = centerC.x - centerA.x;
      const dy = centerC.y - centerA.y;
      const length = Math.hypot(dx,dy);
      const angle = Math.atan2(dy,dx) * 180 / Math.PI;
      winLine.style.width = length + 'px';
      winLine.style.left = (centerA.x - length/2 + boardRect.width/2) + 'px';
      winLine.style.top = (centerA.y) + 'px';
      winLine.style.transform = `translateX(-50%) rotate(${angle}deg)`;
      winLine.style.opacity = '1';
      setTimeout(()=> winLine.style.opacity = '0', 2200);
    }

    function handleResult(result){
      isGameActive = false;
      if(result.winner === 'draw'){
        scores.D++;
        scoreDrawEl.textContent = scores.D;
        messageEl.textContent = 'Permainan seri';
      } else {
        scores[result.winner]++;
        if(result.winner === 'X') scoreXEl.textContent = scores.X;
        else scoreOEl.textContent = scores.O;
        messageEl.textContent = `Pemenang: ${result.winner}`;
        result.combo.forEach(i => cells[i].classList.add('win'));
        showWinLine(result.combo);
      }
      renderBoard();
    }

    function pushHistory(){
      history.push(boardState.slice());
      if(history.length > 50) history.shift();
      future = [];
    }

    function makeMove(index, skipHistory){
      if(!isGameActive || boardState[index]) return false;
      if(!skipHistory) pushHistory();
      boardState[index] = currentPlayer;
      const result = checkWinner();
      if(result) handleResult(result);
      else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        messageEl.textContent = '';
        if(aiEnabled && currentPlayer === 'O') setTimeout(aiMove, 350);
      }
      renderBoard();
      updateTurnUI();
      return true;
    }

    // Simple AI (minimax small depth)
    function aiMove(){
      // try win, block, else random
      // win
      for(let i=0;i<9;i++){
        if(!boardState[i]){
          boardState[i] = 'O';
          if(checkWinner()?.winner === 'O'){ boardState[i] = ''; makeMove(i); return; }
          boardState[i] = '';
        }
      }
      // block X
      for(let i=0;i<9;i++){
        if(!boardState[i]){
          boardState[i] = 'X';
          if(checkWinner()?.winner === 'X'){ boardState[i] = ''; makeMove(i); return; }
          boardState[i] = '';
        }
      }
      // center
      if(!boardState[4]){ makeMove(4); return; }
      // random corner
      const corners = [0,2,6,8].filter(i=>!boardState[i]);
      if(corners.length){ makeMove(corners[Math.floor(Math.random()*corners.length)]); return; }
      // any
      const empties = boardState.map((v,i)=>v?null:i).filter(v=>v!==null);
      if(empties.length) makeMove(empties[Math.floor(Math.random()*empties.length)]);
    }

    // Hint toggling
    function showHint(){
      // highlight a recommended move
      const empties = boardState.map((v,i)=>v?null:i).filter(v=>v!==null);
      if(!empties.length) return;
      // prefer winning/blocking/center
      let idx = null;
      // win for current player
      for(const i of empties){
        boardState[i] = currentPlayer;
        if(checkWinner()?.winner === currentPlayer){ idx = i; boardState[i] = ''; break; }
        boardState[i] = '';
      }
      if(idx === null){
        // block opponent
        const opp = currentPlayer === 'X' ? 'O' : 'X';
        for(const i of empties){
          boardState[i] = opp;
          if(checkWinner()?.winner === opp){ idx = i; boardState[i] = ''; break; }
          boardState[i] = '';
        }
      }
      if(idx === null && empties.includes(4)) idx = 4;
      if(idx === null) idx = empties[Math.floor(Math.random()*empties.length)];
      // flash the cell
      const el = cells[idx];
      el.animate([{ boxShadow: '0 0 0 0 rgba(255,255,255,0.0)' }, { boxShadow: '0 0 30px 8px rgba(6,182,212,0.08)' }, { boxShadow: '0 0 0 0 rgba(255,255,255,0.0)' }], { duration: 900 });
    }

    // Controls
    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const idx = Number(cell.dataset.index);
        makeMove(idx);
      });
      cell.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); makeMove(Number(cell.dataset.index)); }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      boardState = Array(9).fill('');
      currentPlayer = 'X';
      isGameActive = true;
      history = [];
      future = [];
      messageEl.textContent = '';
      winLine.style.opacity = '0';
      renderBoard();
      updateTurnUI();
    });

    document.getElementById('clearScoreBtn').addEventListener('click', () => {
      scores = { X:0, O:0, D:0 };
      scoreXEl.textContent = '0';
      scoreOEl.textContent = '0';
      scoreDrawEl.textContent = '0';
    });

    document.getElementById('aiBtn').addEventListener('click', (e) => {
      aiEnabled = !aiEnabled;
      e.target.textContent = aiEnabled ? 'Matikan AI' : 'Main vs AI';
      messageEl.textContent = aiEnabled ? 'AI aktif. Anda bermain sebagai X.' : 'AI nonaktif. Mainkan bersama teman.';
      // if AI enabled and it's O's turn, let AI move
      if(aiEnabled && currentPlayer === 'O' && isGameActive) setTimeout(aiMove, 350);
    });

    document.getElementById('hintBtn').addEventListener('click', () => {
      showHint();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
      if(!history.length) return;
      future.push(boardState.slice());
      boardState = history.pop();
      isGameActive = true;
      currentPlayer = boardState.filter(Boolean).length % 2 === 0 ? 'X' : 'O';
      messageEl.textContent = 'Undo';
      renderBoard();
      updateTurnUI();
    });

    document.getElementById('redoBtn').addEventListener('click', () => {
      if(!future.length) return;
      history.push(boardState.slice());
      boardState = future.pop();
      isGameActive = true;
      currentPlayer = boardState.filter(Boolean).length % 2 === 0 ? 'X' : 'O';
      messageEl.textContent = 'Redo';
      renderBoard();
      updateTurnUI();
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      // quick theme swap
      document.documentElement.style.setProperty('--accent', getRandomColor());
      document.documentElement.style.setProperty('--accent-2', getRandomColor());
      messageEl.textContent = 'Tema diganti';
    });

    function getRandomColor(){
      const palette = ['#06b6d4','#7c3aed','#ff7a7a','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4'];
      return palette[Math.floor(Math.random()*palette.length)];
    }

    // init
    renderBoard();
    updateTurnUI();
  </script>
</body>
</html>
